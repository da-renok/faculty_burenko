<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Факультет інформатики НаУКМА{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f6fa; color: #222; }
    header { background: #1f3a68; padding: 15px 30px; }
    header a { color: white; margin-right: 25px; text-decoration: none; font-weight: bold; }
    header a:hover { text-decoration: underline; }
    main { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .card { background: white; padding: 15px 20px; margin-bottom: 15px;
            border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .open { color: green; font-weight: bold; }
    .closed { color: crimson; font-weight: bold; }
    a { color: #1f3a68; }
  </style>
</head>
<body>
  <header>
    <a href="/">Головна</a>
    <a href="/departments/">Кафедри</a>
    <a href="/programs/">Спеціальності</a>
    <a href="/exchange/">Обмін</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
