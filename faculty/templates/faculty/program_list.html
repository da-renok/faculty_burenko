{% extends 'faculty/base.html' %}
{% block content %}
<h1>Спеціальності</h1>
{% for p in programs %}
  <div class="card">
    <h3><a href="{% url 'program_detail' p.id %}">{{ p.name }}</a> ({{ p.code }})</h3>
    <p>{{ p.description|truncatewords:50 }}</p>
    <p>Координатор набору: {{ p.coordinator_name }}, {{ p.coordinator_contact }}</p>
  </div>
{% endfor %}
{% endblock %}
